[package]
name = "rust"
version = "0.1.0"
edition = "2024"

[dependencies]
godot = "0.5.5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# The web build generates its API from GDRUST_GODOT_BIN, so both API features can't share one dependency.
[target.'cfg(not(target_os = "emscripten"))'.dependencies]
godot = { version = "0.5.5", features = ["api-4-7"] }

[target.'cfg(target_os = "emscripten")'.dependencies]
godot = { version = "0.5.5", features = ["api-custom", "experimental-wasm", "lazy-function-tables"] }

[features]
nothreads = ["godot/experimental-wasm-nothreads"]

[lib]
# cdylib: the GDExtension library Godot loads. rlib: lets `cargo test` link `core`.
crate-type = ["cdylib", "rlib"]
