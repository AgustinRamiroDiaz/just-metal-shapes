[package]
name = "rust"
version = "0.1.0"
edition = "2024"

[dependencies]
godot = "0.5.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(target_os = "emscripten")'.dependencies]
godot = { version = "0.5.3", features = ["api-custom", "experimental-wasm", "lazy-function-tables"] }

[features]
nothreads = ["godot/experimental-wasm-nothreads"]

[lib]
# cdylib: the GDExtension library Godot loads. rlib: lets `cargo test` link `core`.
crate-type = ["cdylib", "rlib"]
